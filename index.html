<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Futebol Manager Online</title><style>body{font-family:system-ui;background:#f3f6fa;color:#172b3a;margin:0}header{background:#103b30;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:16px}.panel{background:white;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 2px 8px #0001}input,select,button{padding:10px;margin:5px;border:1px solid #ccd;border-radius:7px}button{background:#146c50;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}.muted{color:#657}.grid{display:flex;flex-wrap:wrap;gap:8px}h1{margin:0}img.crest{width:35px;height:35px;object-fit:contain;vertical-align:middle}</style></head><body><header><h1>⚽ Futebol Manager Online</h1><p>Campeonatos, jogos e classificação</p></header><main><section class="panel"><label>Campeonato <select id="champSelect"></select></label><button id="loginToggle">Área administrativa</button><p id="status" class="muted"></p></section><section class="panel hidden" id="loginBox"><h2>Entrar como administrador</h2><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="login">Entrar</button><button id="logout" class="hidden">Sair</button></section><section id="admin" class="hidden"><div class="panel"><h2>Novo campeonato</h2><input id="champName" placeholder="Nome do campeonato"><button id="addChamp">Cadastrar</button></div><div class="panel"><h2>Novo time</h2><input id="teamName" placeholder="Nome do time"><input id="teamCrest" type="url" placeholder="URL do escudo (opcional)"><button id="addTeam">Cadastrar</button></div><div class="panel"><h2>Novo jogador</h2><input id="playerName" placeholder="Nome do jogador"><select id="playerTeam"></select><input id="playerNumber" type="number" placeholder="Camisa"><button id="addPlayer">Cadastrar</button></div><div class="panel"><h2>Novo jogo / resultado</h2><select id="home"></select><input id="homeScore" type="number" min="0" placeholder="Gols casa"><span>×</span><input id="awayScore" type="number" min="0" placeholder="Gols visitante"><select id="away"></select><input id="matchDate" type="datetime-local"><input id="matchVenue" placeholder="Local"><button id="addMatch">Salvar jogo</button><p class="muted">Deixe os gols em branco para jogo ainda não realizado.</p></div></section><section class="panel"><h2>Classificação</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Time</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody id="standings"></tbody></table></div></section><section class="panel"><h2>Jogos</h2><div id="matches"></div></section><section class="panel"><h2>Times e jogadores</h2><div id="teams"></div></section></main><script type="module" src="./app.js"></script></body></html>
